<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; font-size: 15px; color: #222; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    .footer { margin-top: 30px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <p>Hi {{first_name}},</p>

    <p>
      Thank you for your interest in <strong>{{company}}</strong>. We wanted to
      follow up regarding order <strong>#{{order_id}}</strong>.
    </p>

    <p>
      Please don't hesitate to reach out if you have any questions. We're happy
      to help!
    </p>

    <p>Best regards,<br>Your Name</p>

    <div class="footer">
      You are receiving this email because you signed up at {{company}}.
    </div>
  </div>
</body>
</html>
